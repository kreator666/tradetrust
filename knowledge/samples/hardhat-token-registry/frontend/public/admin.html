<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>权限管理 | TradeTrust Official</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 24px; background: #f5f7fa; color: #1f2937; }
    .container { max-width: 720px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 32px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    h1 { margin-top: 0; font-size: 22px; }
    a { color: #2563eb; text-decoration: none; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; font-size: 14px; }
    input[type="text"], select { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-family: monospace; }
    button { margin-top: 16px; margin-right: 8px; padding: 10px 18px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    button.warning { background: #dc2626; }
    .result { margin-top: 16px; padding: 16px; border-radius: 8px; background: #f3f4f6; font-size: 14px; line-height: 1.6; }
    .result.success { background: #d1fae5; color: #065f46; }
    .result.error { background: #fee2e2; color: #991b1b; }
    .wallet-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; font-size: 13px; }
    .wallet-info { padding: 6px 12px; background: #f3f4f6; border-radius: 6px; font-family: monospace; }
    .info { margin-top: 16px; padding: 12px; background: #eff6ff; border-radius: 6px; font-size: 13px; color: #1e40af; }
    code { font-family: monospace; background: #f3f4f6; padding: 2px 6px; border-radius: 4px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="container">
    <h1>权限管理</h1>
    <p><a href="index.html">← 返回首页</a></p>

    <div class="wallet-bar">
      <span id="walletStatus">钱包未连接</span>
      <button id="connectBtn" type="button">连接钱包</button>
    </div>

    <div class="info">
      官方 Token Registry 角色：
      <code>DefaultAdmin</code>（可授权/撤销所有角色）、
      <code>MinterRole</code>（铸造）、
      <code>AccepterRole</code>（接受归还）、
      <code>RestorerRole</code>（恢复 token）。
    </div>

    <label for="target">目标地址</label>
    <input id="target" type="text" placeholder="0x..." />

    <label for="role">角色</label>
    <select id="role">
      <option value="MINTER_ROLE">MinterRole</option>
      <option value="ACCEPTER_ROLE">AccepterRole</option>
      <option value="RESTORER_ROLE">RestorerRole</option>
    </select>

    <button id="check">检查角色</button>
    <button id="grant">授权角色</button>
    <button id="revoke" class="warning">撤销角色</button>

    <div id="result"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>
  <script src="js/common.js?v=1"></script>
  <script>
    const walletStatus = document.getElementById('walletStatus');
    const connectBtn = document.getElementById('connectBtn');
    const targetInput = document.getElementById('target');
    const roleSelect = document.getElementById('role');
    const checkBtn = document.getElementById('check');
    const grantBtn = document.getElementById('grant');
    const revokeBtn = document.getElementById('revoke');
    const result = document.getElementById('result');

    function updateWalletStatus() {
      if (WALLET.connected) {
        walletStatus.innerHTML = `<span class="wallet-info">已连接 ${short(WALLET.address)}</span>`;
        connectBtn.textContent = '已连接';
        connectBtn.disabled = true;
      } else {
        walletStatus.textContent = '钱包未连接';
        connectBtn.textContent = '连接钱包';
        connectBtn.disabled = false;
      }
    }

    onWalletUIUpdate(updateWalletStatus);

    connectBtn.addEventListener('click', async () => {
      try {
        await connectWallet();
        updateWalletStatus();
      } catch (e) {
        alert(`连接失败：${e.message}`);
      }
    });

    function show(msg, success) {
      result.innerHTML = msg;
      result.className = `result ${success ? 'success' : 'error'}`;
    }

    function getTarget() {
      const addr = targetInput.value.trim();
      if (!/^0x[0-9a-fA-F]{40}$/.test(addr)) throw new Error('请输入有效以太坊地址');
      return addr;
    }

    async function getRoleHash(registry, roleName) {
      if (roleName === 'MINTER_ROLE') return registry.MINTER_ROLE();
      if (roleName === 'ACCEPTER_ROLE') return registry.ACCEPTER_ROLE();
      if (roleName === 'RESTORER_ROLE') return registry.RESTORER_ROLE();
      throw new Error('未知角色');
    }

    checkBtn.addEventListener('click', async () => {
      try {
        const addr = getTarget();
        const provider = getReadProvider();
        const registry = getTokenRegistryContract(provider);
        const role = await getRoleHash(registry, roleSelect.value);
        const has = await registry.hasRole(role, addr);
        show(`地址 <code>${addr}</code> ${has ? '拥有' : '没有'} <code>${roleSelect.value}</code>`, has);
      } catch (e) {
        show(`检查失败：${e.message}`, false);
      }
    });

    grantBtn.addEventListener('click', async () => {
      try {
        const addr = getTarget();
        const signer = await getConnectedSigner();
        const registry = getTokenRegistryContract(signer);
        const role = await getRoleHash(registry, roleSelect.value);
        const tx = await registry.grantRole(role, addr);
        await tx.wait();
        show(`已授权 <code>${addr}</code> 拥有 <code>${roleSelect.value}</code><br/>交易：<a href="https://sepolia.etherscan.io/tx/${tx.hash}" target="_blank">${tx.hash}</a>`, true);
      } catch (e) {
        show(`授权失败：${e.reason || e.message}`, false);
      }
    });

    revokeBtn.addEventListener('click', async () => {
      if (!confirm('确定要撤销该角色吗？')) return;
      try {
        const addr = getTarget();
        const signer = await getConnectedSigner();
        const registry = getTokenRegistryContract(signer);
        const role = await getRoleHash(registry, roleSelect.value);
        const tx = await registry.revokeRole(role, addr);
        await tx.wait();
        show(`已撤销 <code>${addr}</code> 的 <code>${roleSelect.value}</code><br/>交易：<a href="https://sepolia.etherscan.io/tx/${tx.hash}" target="_blank">${tx.hash}</a>`, true);
      } catch (e) {
        show(`撤销失败：${e.reason || e.message}`, false);
      }
    });

    document.addEventListener('DOMContentLoaded', async () => {
      await window.configReady;
      updateWalletStatus();
    });
  </script>
</body>
</html>
