<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>签发文档 | TradeTrust Demo</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 24px; background: #f5f7fa; color: #1f2937; }
    .container { max-width: 720px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 32px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    h1 { margin-top: 0; font-size: 22px; }
    a { color: #2563eb; text-decoration: none; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; font-size: 14px; }
    input[type="file"] { display: block; }
    .hash { margin-top: 12px; padding: 12px; background: #f3f4f6; border-radius: 6px; font-family: monospace; font-size: 13px; word-break: break-all; }
    button { margin-top: 16px; margin-right: 8px; padding: 10px 18px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    button.secondary { background: #6b7280; }
    button.secondary:hover { background: #4b5563; }
    .result { margin-top: 16px; padding: 16px; border-radius: 8px; background: #f3f4f6; font-size: 14px; }
    .result.success { background: #d1fae5; color: #065f46; }
    .result.error { background: #fee2e2; color: #991b1b; }
    .muted { color: #6b7280; font-size: 12px; }
    .wallet-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; font-size: 13px; }
    .wallet-info { padding: 6px 12px; background: #f3f4f6; border-radius: 6px; font-family: monospace; }
  </style>
</head>
<body>
  <div class="container">
    <h1>签发文档</h1>
    <p><a href="index.html">← 返回首页</a></p>

    <div class="wallet-bar">
      <span id="walletStatus">钱包未连接</span>
      <button id="connectBtn" type="button">连接钱包</button>
      <button id="checkRoleBtn" type="button" disabled>检查签发权限</button>
    </div>

    <p class="muted">上传任意文件，前端会计算其 keccak256 哈希，然后写入 DocumentRegistry。</p>

    <label for="file">选择文件</label>
    <input id="file" type="file" />
    <button id="compute" type="button">计算文档哈希</button>

    <div id="hashBox" class="hash" style="display:none;"></div>

    <button id="issueWallet" type="button" disabled>使用钱包签名签发</button>
    <button id="issueBackend" type="button" class="secondary">使用本地部署账户代签</button>

    <div id="result"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>
  <script src="js/common.js?v=12"></script>
  <script>
    const walletStatus = document.getElementById('walletStatus');
    const connectBtn = document.getElementById('connectBtn');
    const checkRoleBtn = document.getElementById('checkRoleBtn');
    const fileInput = document.getElementById('file');
    const computeBtn = document.getElementById('compute');
    const issueWalletBtn = document.getElementById('issueWallet');
    const issueBackendBtn = document.getElementById('issueBackend');
    const hashBox = document.getElementById('hashBox');
    const result = document.getElementById('result');

    let currentHash = '';
    let hasIssuerRole = false;

    function setIssueBtn() {
      issueWalletBtn.disabled = !(WALLET.connected && hasIssuerRole && currentHash);
    }

    function updateWalletStatus() {
      if (WALLET.connected) {
        walletStatus.innerHTML = `<span class="wallet-info">已连接 ${short(WALLET.address)} (chainId=${WALLET.chainId})</span>`;
        connectBtn.textContent = '已连接';
        connectBtn.disabled = true;
        checkRoleBtn.disabled = false;
      } else {
        walletStatus.textContent = '钱包未连接';
        connectBtn.textContent = '连接钱包';
        connectBtn.disabled = false;
        checkRoleBtn.disabled = true;
        hasIssuerRole = false;
      }
      setIssueBtn();
    }

    onWalletUIUpdate(updateWalletStatus);

    async function checkIssuerRole(auto = false) {
      if (!WALLET.connected || !CONFIG.registry) return;
      try {
        if (!auto) checkRoleBtn.disabled = true;
        walletStatus.innerHTML = `<span class="wallet-info">已连接 ${short(WALLET.address)}</span> <span style="color:#6b7280;">正在检查 ISSUER_ROLE…</span>`;
        const provider = getReadProvider();
        const registry = getRegistryContract(provider);
        const role = await registry.ISSUER_ROLE();
        hasIssuerRole = await registry.hasRole(role, WALLET.address);
        updateWalletStatus();
        if (hasIssuerRole) {
          walletStatus.innerHTML += ' <span style="color:#065f46;">✓ 拥有 ISSUER_ROLE</span>';
        } else {
          walletStatus.innerHTML += ' <span style="color:#991b1b;">✗ 无 ISSUER_ROLE</span>';
          if (!auto) alert('当前钱包没有 ISSUER_ROLE，请使用本地部署账户代签或先到「权限管理」页授权。');
        }
      } catch (e) {
        if (!auto) alert(`检查失败：${e.message}`);
        hasIssuerRole = false;
        updateWalletStatus();
      } finally {
        if (!auto) checkRoleBtn.disabled = false;
      }
    }

    connectBtn.addEventListener('click', async () => {
      try {
        await connectWallet();
        updateWalletStatus();
        await checkIssuerRole(true);
      } catch (e) {
        alert(`连接失败：${e.message}`);
      }
    });

    checkRoleBtn.addEventListener('click', () => checkIssuerRole(false));

    computeBtn.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) { alert('请先选择文件'); return; }
      currentHash = await hashFile(file);
      hashBox.style.display = 'block';
      hashBox.textContent = `keccak256: ${currentHash}`;
      result.textContent = '';
      result.className = 'result';
      setIssueBtn();
    });

    async function showIssueResult(data, success) {
      if (success) {
        result.innerHTML = `
          <strong>签发成功</strong><br/>
          文档哈希：<code>${data.documentHash}</code><br/>
          交易哈希：<a href="https://sepolia.etherscan.io/tx/${data.txHash}" target="_blank">${data.txHash}</a>
        `;
        result.className = 'result success';
      } else {
        result.textContent = `失败：${data.error || data}`;
        result.className = 'result error';
      }
    }

    function decodeIssueError(e) {
      const msg = e.reason || e.message || String(e);
      const data = e.data || (e.error && e.error.data) || '';
      if (msg.includes('DocumentAlreadyIssued') || data.includes('5f1b530c')) {
        return '该文档哈希已被签发，请勿重复签发。可到「验证文档」页查询状态。';
      }
      if (msg.includes('AccessControlUnauthorizedAccount') || data.includes('e2517d3f')) {
        return '当前钱包没有 ISSUER_ROLE，请先到「权限管理」页授权。';
      }
      if (msg.includes('EnforcedPause')) {
        return '合约已暂停签发。';
      }
      return msg;
    }

    issueWalletBtn.addEventListener('click', async () => {
      if (!currentHash) return;
      issueWalletBtn.disabled = true;
      try {
        const signer = await getConnectedSigner();
        const registry = getRegistryContract(signer);

        // 先检查是否已被签发，避免直接提交交易浪费 gas
        const isValid = await registry.isValid(currentHash);
        if (isValid) {
          await showIssueResult(
            { error: '该文档哈希已被签发，请勿重复签发。可到「验证文档」页查询状态。' },
            false
          );
          return;
        }

        const tx = await registry.issue(currentHash);
        await tx.wait();
        await showIssueResult({ documentHash: currentHash, txHash: tx.hash }, true);
      } catch (e) {
        await showIssueResult({ error: decodeIssueError(e) }, false);
      } finally {
        issueWalletBtn.disabled = false;
      }
    });

    issueBackendBtn.addEventListener('click', async () => {
      if (!currentHash) return;
      issueBackendBtn.disabled = true;
      try {
        const res = await fetch('/api/issue', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ documentHash: currentHash }),
        });
        const data = await res.json();
        await showIssueResult(data, data.success);
      } catch (e) {
        await showIssueResult({ error: e.message }, false);
      } finally {
        issueBackendBtn.disabled = false;
      }
    });

    document.addEventListener('DOMContentLoaded', async () => {
      await window.configReady;
      updateWalletStatus();
      if (WALLET.connected) {
        await checkIssuerRole(true);
      }
    });
  </script>
</body>
</html>
